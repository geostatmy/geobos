<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOBOS Get Started</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: #fff;
}

/* Container */
.container {
    max-width: 420px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

/* Poster / Hero */
.hero {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* Title */
.logo {
    font-size: 26px;
    font-weight: 600;
    margin-top: 10px;
}

.subtitle {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 25px;
}

/* Glass Card */
.card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 15px;
    text-decoration: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: 0.25s;
    border: 1px solid rgba(255,255,255,0.08);
}

.card:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.08);
}

/* Icon */
.icon {
    font-size: 20px;
}

/* Text */
.text {
    flex: 1;
    text-align: left;
    margin-left: 10px;
}

.title {
    font-size: 15px;
    font-weight: 500;
}

/* Arrow */
.arrow {
    font-size: 16px;
    color: #94a3b8;
}

/* Footer */
.footer {
    margin-top: 20px;
    font-size: 12px;
    color: #64748b;
}
</style>

</head>

<body>

<div class="container">

    <!-- Poster (Replace image link) -->
    <img src="howbos.jpeg" class="hero">

    <div class="logo">GEOBOS</div>
    <div class="subtitle">Get Started in Minutes</div>

    <!-- Register -->
    <a href="YOUR_REGISTER_LINK" class="card">
        <div class="icon">📝</div>
        <div class="text">
            <div class="title">Register BOS</div>
        </div>
        <div class="arrow">→</div>
    </a>

    <!-- Download -->
    <a href="YOUR_APP_DOWNLOAD_LINK" class="card">
        <div class="icon">📲</div>
        <div class="text">
            <div class="title">Download App</div>
        </div>
        <div class="arrow">→</div>
    </a>

    <!-- Guide -->
    <a href="YOUR_USER_GUIDE_LINK" class="card">
        <div class="icon">📘</div>
        <div class="text">
            <div class="title">Quick User Guide</div>
        </div>
        <div class="arrow">→</div>
    </a>

    <div class="footer">
        Powered by GEOBOS
    </div>

</div>

</body>
</html>
