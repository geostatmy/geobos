<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOBOS Get Started</title>
<link
  rel="shortcut icon"
  href="assets/images/favicon.png"
  type="image/x-icon"
/>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: #fff;
}

/* Container */
@media (min-width: 768px) {
.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px 16px;
    text-align: center;
    align-items: center;
}    
} 

/* Poster / Hero */
.hero {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* Title */
.logo {
    font-size: 30px;
    font-weight: 600;
    margin-top: 10px;
}

.subtitle {
    font-size: 17px;
    color: #94a3b8;
    margin-bottom: 25px;
}

/* Glass Card */
.card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 15px;
    text-decoration: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: 0.25s;
    border: 1px solid rgba(255,255,255,0.08);
}

.card:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.08);
}

/* Icon */
.icon {
    font-size: 20px;
}

/* Text */
.text {
    flex: 1;
    text-align: left;
    margin-left: 10px;
}

.title {
    font-size: 15px;
    font-weight: 500;
}

/* Arrow */
.arrow {
    font-size: 16px;
    color: #94a3b8;
}

/* Footer */
.footer {
    margin-top: 20px;
    font-size: 12px;
    color: #64748b;
}
</style>

</head>

<body>

<div class="container">

    <!-- Poster (Replace image link) -->
    <img src="howbos.jpeg" class="hero">

    <center><div class="logo">GEOBOS</div>
    <div class="subtitle">Let's Get Your Business Started</div></center>

    <!-- Register -->
    <a href="https://www.geobos.app/newbos/reg.html" class="card">
        <div class="icon">📝</div>
        <div class="text">
            <div class="title">Register BOS</div>
        </div>
        <div class="arrow">→</div>
    </a>

    <!-- Guide -->
    <a href="https://www.geobos.app/guide" class="card">
        <div class="icon">📘</div>
        <div class="text">
            <div class="title">Quick User Guide</div>
        </div>
        <div class="arrow">→</div>
    </a>

    <div class="footer">
          <center><div class="copyright">
        © 2026 GEOBOS. All rights reserved.
    </div></center>
        <br><br>
    </div>

</div>

</body>
</html>
