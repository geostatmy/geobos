<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEOBOS User Guide</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100%;
      background: url('geobos_quick_guide.png') no-repeat center center;
      background-size: cover;
      background-color: #0b0f2a;
      font-family: Arial, sans-serif;
      position: relative;
    }

    /* Optional overlay untuk nampak lebih premium */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
    }

    /* Optional fade-in */
    .fade-in {
      height: 100%;
      width: 100%;
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(1.02);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="overlay"></div>
  <div class="fade-in"></div>
</body>
</html>
