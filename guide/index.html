<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEOBOS User Guide - Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #0b0f2a; /* fallback */
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .image-wrapper {
      width: 100%;
      max-width: 900px;
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* Mobile tweak */
    @media (max-width: 768px) {
      .image-wrapper {
        max-width: 95%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="image-wrapper">
      <!-- Tukar nama file ikut image abe -->
      <img src="guide_comingsoon.jpeg" alt="GEOBOS User Guide Coming Soon" />
    </div>
  </div>
</body>
</html>
